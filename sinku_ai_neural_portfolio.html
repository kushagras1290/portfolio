      // Deterministic Fibonacci-sphere geometry; rotation, parallax, graph edges and

        c.clearRect(0,0,width,height);
        drawNeuralAtlas(c,width*.735,height*.49,Math.min(width*.36,height*.63),time,projects[index].rgb);
        c.save();c.strokeStyle=`rgba(${projects[index].rgb},.15)`;c.lineWidth=1;
        c.beginPath();c.moveTo(width*.57,height*.15);c.lineTo(width*.57,height*.85);c.moveTo(width*.85,height*.15);c.lineTo(width*.85,height*.85);c.stroke();c.restore();
      }
      function draw(){if(!visible)return;frame++;ctx.clearRect(0,0,w,h);const t=reduced.matches?0:frame*.006;const cx=w*.53+mouse.x*10,cy=h*.47+mouse.y*8;
        // A volumetric, rotating AI neural atlas replaces the previous spine/helix.
        drawNeuralAtlas(ctx,cx,cy,Math.min(w*.29,h*.50,445),t,'131,222,216',true);
        renderCardCore(active,t);
        // Atmospheric bokeh: parallax and subtle vertical drift.
        for(const p of dots){const x=p.x*w+mouse.x*p.depth*12+Math.sin(t*.6+p.phase)*p.depth*5;const y=p.y*h+mouse.y*p.depth*9+Math.cos(t*.8+p.phase)*p.depth*8;const r=p.r*p.depth*(w<700?.65:1);const alpha=.13+(.12+.16*Math.sin(t+p.phase)**2)*p.depth;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=`hsla(${p.hue},68%,73%,${Math.min(alpha,.65)})`;ctx.fill()}
        // Two clouds of micro-fragments framing the project panels.
        for(let cloud=0;cloud<2;cloud++){
          const bx=(cloud===0?.77:.33)*w,by=(cloud===0?.3:.81)*h;
          for(let i=0;i<145;i++){
            const a=i*2.39996+cloud*1.8,dist=Math.sqrt(i/145)*(cloud===0?Math.min(w*.15,220):Math.min(w*.18,290));
            const x=bx+Math.cos(a+t*.08)*dist+mouse.x*(cloud?12:22),y=by+Math.sin(a+t*.06)*dist*.77+mouse.y*13;
            const sz=((i*19)%7+1)*.34*(w<700?.5:1);ctx.fillStyle=`hsla(${(i*29+cloud*95)%120+175},62%,${42+i%35}%,${.065+(i%6)*.033})`;ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fill();
          }
        }
        if(!reduced.matches)raf=requestAnimationFrame(draw);
      }
      function start(){cancelAnimationFrame(raf);if(visible){neuralCanvases.forEach((_,i)=>renderCardCore(i,reduced.matches?0:frame*.006));draw()}}
      document.addEventListener('visibilitychange',()=>{visible=!document.hidden;if(visible)start();else cancelAnimationFrame(raf)});
      window.addEventListener('resize',()=>{resize();start()},{passive:true});
      window.addEventListener('pointermove',e=>{mouse.targetX=(e.clientX/window.innerWidth-.5)*2;mouse.targetY=(e.clientY/window.innerHeight-.5)*2;mouse.x+=(mouse.targetX-mouse.x)*.2;mouse.y+=(mouse.targetY-mouse.y)*.2;if(reduced.matches)start()},{passive:true});
      reduced.addEventListener?.('change',start);resize();start();
    })();
  </script>
</body>
